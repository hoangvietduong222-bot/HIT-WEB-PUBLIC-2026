<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Card</title>

    <link rel="stylesheet" href="../WEEK-3/style.css">
</head>
<body>
    <div class="card">
        <img src="avatar.jpg" alt="Avatar" class="avatar">
       
        <h1 class="name">Hoàng Việt Dương</h1>

        <p class="job">
            Information System<br>
            Student
        </p>

        <div class="info">
            <p>📍 Hà Nội</p>
            <p>🏫 Đại học Công nghiệp Hà Nội</p>
            <p>🎮 Sở thích: Bóng rổ</p>
        </div>

    <div class="skills">
    <span class="skill">HTML</span>
    <span class="skill">CSS</span>
    <span class="skill">JavaScript</span>
    </div>

    <div class="buttons">
    <a href="#" class="btn follow">Follow</a>
     <a href="#" class="btn message">Message</a>
    </div>

    </div>

</body>
</html>
